<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>めんたい工房 v3 🍣 〜しゃりの海老式経営〜</title>

  <!-- OGP / Twitter Card -->
  <meta property="og:title" content="めんたい工房 v3 🍣 〜しゃりの海老式経営〜">
  <meta property="og:description" content="魚卵を獲って、漬けて、売る！ぷりぷり海老のカジュアル放置クリッカーゲーム🦐">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://d52425.github.io/mentai_clicker/">
  <meta property="og:image" content="https://d52425.github.io/mentai_clicker/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="めんたい工房 v3 🍣 〜しゃりの海老式経営〜">
  <meta name="twitter:description" content="魚卵を獲って、漬けて、売る！ぷりぷり海老のカジュアル放置クリッカーゲーム🦐">
  <meta name="twitter:image" content="https://d52425.github.io/mentai_clicker/ogp.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <header class="header">
      <div class="header-left">
        <h1>🍣 めんたい工房 <span class="version">v3</span></h1>
        <p class="subtitle">〜しゃりの海老式めんたい経営〜</p>
      </div>
      <button class="share-btn" type="button" aria-label="Xでシェア" onclick="shareOnX(event)">
        🐦 シェア
      </button>
    </header>

    <div class="main-layout-v3">
      <!-- 左: クリッカー・リソース・アクション -->
      <section class="pane pane-left">
        <div class="resource-display">
          <div class="resource-item fish-res" onclick="game.actionFish(event)">
            <span class="res-icon">🐟</span>
            <div class="res-info">
              <div class="res-name">魚卵</div>
              <div class="res-value" id="res-roe">0</div>
              <div class="res-rate" id="rate-roe">+0.0/s</div>
            </div>
          </div>
          <div class="resource-item mentai-res" onclick="game.actionMake(event)">
            <span class="res-icon">🔴</span>
            <div class="res-info">
              <div class="res-name">めんたい</div>
              <div class="res-value" id="res-mentai">0</div>
              <div class="res-rate" id="rate-mentai">+0.0/s</div>
            </div>
          </div>
          <div class="resource-item money-res" onclick="game.actionSell(event)">
            <span class="res-icon">💰</span>
            <div class="res-info">
              <div class="res-name">売上</div>
              <div class="res-value" id="res-money">0</div>
              <div class="res-rate" id="rate-money">+0.0/s</div>
            </div>
          </div>
        </div>

        <div class="clicker-area">
          <div class="clicker-zone fish-zone" onclick="game.actionFish(event)" title="クリックで魚卵を獲得！">
            <div class="clicker-icon">🌊</div>
            <div class="clicker-label">漁に出る</div>
            <div class="clicker-hint" id="click-hint-fish">🐟 +1</div>
          </div>
          <div class="clicker-zone make-zone" onclick="game.actionMake(event)" title="クリックでめんたいを漬ける！">
            <div class="clicker-icon">🍣</div>
            <div class="clicker-label">めんたいを漬ける</div>
            <div class="clicker-hint" id="click-hint-make">魚卵 1 → 🔴 +1</div>
          </div>
          <div class="clicker-zone sell-zone" onclick="game.actionSell(event)" title="クリックでめんたいを売る！">
            <div class="clicker-icon">🏪</div>
            <div class="clicker-label">販売する</div>
            <div class="clicker-hint" id="click-hint-sell">🔴 1 → 💰 +<span class="sell-price-static">10</span></div>
          </div>
        </div>

        <div class="log-area-compact">
          <div class="log-title">📜 しゃりの経営日誌</div>
          <div class="log-content" id="log-content"></div>
        </div>
      </section>

      <!-- 真ん中: パワーアップ反映シミュレーション -->
      <section class="pane pane-center">
        <div class="sim-header">
          <span class="sim-title">🦐 めんたいパーティクル宇宙</span>
          <span class="sim-status" id="sim-status">生産停止中...</span>
        </div>
        <div class="sim-canvas-wrap">
          <canvas id="sim-canvas"></canvas>
        </div>
        <div class="sim-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#6bcb77"></span> 魚卵</span>
          <span class="legend-item"><span class="legend-dot" style="background:#ff6b6b"></span> めんたい</span>
          <span class="legend-item"><span class="legend-dot" style="background:#ffd93d"></span> 売上</span>
          <span class="legend-item"><span class="legend-dot" style="background:#4d96ff"></span> 自動生産</span>
        </div>
      </section>

      <!-- 右: パワーアップショップ -->
      <section class="pane pane-right">
        <div class="shop-header">
          <h2>⬆️ パワーアップ工房</h2>
          <div class="shop-money">
            <span>💰</span> <span id="shop-money">0</span>
          </div>
        </div>
        <div class="shop-tabs">
          <button class="shop-tab active" data-shop="fish" onclick="game.switchShop('fish')">🌊 漁業</button>
          <button class="shop-tab" data-shop="make" onclick="game.switchShop('make')">🔴 製造</button>
          <button class="shop-tab" data-shop="sell" onclick="game.switchShop('sell')">🏪 販売</button>
        </div>
        <div class="shop-content">
          <div class="shop-panel active" data-shop="fish" id="upg-fish"></div>
          <div class="shop-panel" data-shop="make" id="upg-make"></div>
          <div class="shop-panel" data-shop="sell" id="upg-sell"></div>
        </div>
      </section>
    </div>

    <footer class="footer">
      made with 🦐 by しゃりさん | Blender縛りの会は関係ない
    </footer>
  </div>

  <script src="script.js"></script>
  <script src="visualizer.js"></script>
</body>
</html>
