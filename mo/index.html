<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>めんたいオーシャン - 港拠点メニュー</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Noto Sans JP"', 'sans-serif'],
        },
        colors: {
          deepsea: {
            900: '#070f1a',
            800: '#0c182a',
            700: '#111f38',
            600: '#1c3a5f',
            500: '#3a5a7a',
            400: '#6a95b8',
            300: '#8ec0e8',
            200: '#bde3f8',
            100: '#e6f4ff',
          },
          mentai: {
            500: '#ff9aae',
            600: '#ff7a8a',
            glow: 'rgba(255,154,174,0.2)',
          },
          anchor: {
            DEFAULT: '#38858a',
            light: '#4aaf9f',
          },
          sunset: {
            DEFAULT: '#ffb347',
            dark: '#ff9933',
          }
        },
        boxShadow: {
          'card': '0 4px 18px rgba(0,0,0,0.4)',
          'glow-mentai': '0 0 30px rgba(255,154,174,0.2)',
          'btn-depart': '0 5px 18px rgba(255,153,50,0.35)',
        }
      }
    }
  }
</script>
<style type="text/tailwindcss">
  @layer utilities {
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tap-active:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
  }
</style>
</head>
<body class="bg-deepsea-900 text-deepsea-200 min-h-screen font-sans antialiased">

<div class="max-w-[430px] mx-auto min-h-screen flex flex-col bg-gradient-to-b from-deepsea-800/50 via-deepsea-900 to-deepsea-900 px-4 py-6">

  <!-- ヘッダー -->
  <header class="text-center mb-6">
    <div class="mb-2 animate-bounce">
      <i data-lucide="shrimp" class="w-14 h-14 mx-auto text-mentai-500 drop-shadow-[0_0_20px_rgba(255,120,120,0.4)]"></i>
    </div>
    <h1 class="text-3xl font-black tracking-widest text-mentai-500 drop-shadow-lg" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">
      めんたいオーシャン
    </h1>
    <p class="mt-1 text-sm text-deepsea-500 tracking-[0.3em] uppercase">The Bering Sea Quota</p>
    <p class="mt-0.5 text-xs text-deepsea-600 tracking-wider">港拠点メニュー</p>
  </header>

  <!-- メインエリア -->
  <main class="flex-1 space-y-5">

    <!-- 漁業・物流エリア -->
    <section class="bg-deepsea-800/75 border border-deepsea-600 rounded-2xl p-5 shadow-card backdrop-blur-sm">
      <div class="flex items-center gap-3 mb-4 pb-3 border-b border-deepsea-600">
        <i data-lucide="factory" class="w-6 h-6 text-deepsea-300"></i>
        <h2 class="text-base font-bold text-deepsea-300 tracking-wide">漁業・物流エリア</h2>
        <span class="ml-auto text-[10px] text-deepsea-500 tracking-wider">帰港して最初</span>
      </div>
      <div class="space-y-3">
        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="fish" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">陸上加工工場</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-sunset px-2.5 py-0.5 rounded-full">売却</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              水揚げしたスケトウダラを売却。鮮度と市場需給で買取価格が変動。ドボドボ吸引パイプの演出付き。
            </p>
          </div>
        </button>

        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="snowflake" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">氷・燃料補給（RSW）</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-sunset px-2.5 py-0.5 rounded-full">補給</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              冷海水チルド氷と重油を満タン補給。怠ると魚が腐る…絶対に立ち寄る必須スポット。
            </p>
          </div>
        </button>
      </div>
    </section>

    <!-- 造船・技術エリア -->
    <section class="bg-deepsea-800/75 border border-deepsea-600 rounded-2xl p-5 shadow-card backdrop-blur-sm">
      <div class="flex items-center gap-3 mb-4 pb-3 border-b border-deepsea-600">
        <i data-lucide="wrench" class="w-6 h-6 text-deepsea-300"></i>
        <h2 class="text-base font-bold text-deepsea-300 tracking-wide">造船・技術エリア</h2>
        <span class="ml-auto text-[10px] text-deepsea-500 tracking-wider">船と漁具強化</span>
      </div>
      <div class="space-y-3">
        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="cog" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">ポート・プレシジョン・ファブ</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-sunset px-2.5 py-0.5 rounded-full">改造</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              船体修理、エンジン馬力アップ、ウィンチ強化。火花散るインダストリアル工房。
            </p>
          </div>
        </button>

        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="net" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">ネットロフト</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-sunset px-2.5 py-0.5 rounded-full">購入</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              中層トロール網の購入・修繕、高性能ソナー、ネットセンサー。ビルド構築の要。
            </p>
          </div>
        </button>
      </div>
    </section>

    <!-- コミュニティ・管理エリア -->
    <section class="bg-deepsea-800/75 border border-deepsea-600 rounded-2xl p-5 shadow-card backdrop-blur-sm">
      <div class="flex items-center gap-3 mb-4 pb-3 border-b border-deepsea-600">
        <i data-lucide="users" class="w-6 h-6 text-deepsea-300"></i>
        <h2 class="text-base font-bold text-deepsea-300 tracking-wide">コミュニティ・管理</h2>
        <span class="ml-auto text-[10px] text-deepsea-500 tracking-wider">情報と人材</span>
      </div>
      <div class="space-y-3">
        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="clipboard-list" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">フィッシャーマンズ・ギルド</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-sky-400 px-2.5 py-0.5 rounded-full">情報</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              クォーター購入・特別依頼、ベーリング海の気象・流氷情報。ランキングと嵐予測。
            </p>
          </div>
        </button>

        <button class="tap-active w-full text-left flex items-start gap-4 p-4 rounded-xl border border-deepsea-600 bg-gradient-to-b from-deepsea-700/90 to-deepsea-800/95 hover:border-deepsea-400 transition-colors">
          <div class="mt-0.5">
            <i data-lucide="beer" class="w-7 h-7 text-deepsea-300 drop-shadow-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[15px] font-bold text-deepsea-100">アンカー・イン</span>
              <span class="text-[10px] font-bold text-deepsea-900 bg-green-400 px-2.5 py-0.5 rounded-full">休息</span>
            </div>
            <p class="text-xs text-deepsea-400 leading-relaxed">
              暖炉と木造の温かい空間。有能クルースカウト、魚群噂話、船員モチベーション回復。
            </p>
          </div>
        </button>
      </div>
    </section>

  </main>

  <!-- 出港ボタン -->
  <div class="mt-6">
    <button class="tap-active w-full flex items-center justify-center gap-3 py-4 rounded-full text-deepsea-900 font-black text-lg tracking-widest bg-gradient-to-b from-sunset to-sunset-dark shadow-btn-depart">
      <i data-lucide="ship" class="w-6 h-6"></i>
      <span>ベーリング海へ出港</span>
    </button>
  </div>

  <!-- フッター -->
  <footer class="mt-6 text-center pb-2">
    <p class="text-[10px] text-deepsea-600 tracking-widest">© めんたい漁業組合 ― 健康は最高のスパイス</p>
  </footer>

</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>
