<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#0a1e3c; overflow:hidden; font-family:'Segoe UI','Hiragino Maru Gothic ProN','Meiryo',sans-serif; }
#gameWrap { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#gameContainer { position:relative; width:800px; height:600px; box-shadow:0 0 40px rgba(0,180,255,0.35); border-radius:12px; overflow:hidden; background:#0b2a4a; }
canvas { display:block; image-rendering:pixelated; }

#scoreBox, #timerBox { position:absolute; top:12px; padding:6px 14px; background:rgba(0,0,0,0.55); border-radius:20px; color:#fff; font-weight:900; font-size:18px; text-shadow:1px 1px 2px #000; }

#overlayContent { text-align:center; color:#fff; max-width:600px; padding:20px; }

.btn { display:inline-block; margin:8px 6px; padding:12px 28px; font-size:18px; font-weight:900; border:none; border-radius:30px; cursor:pointer; transition:transform .15s, box-shadow .15s; pointer-events:auto; }
.btn:hover { transform:translateY(-3px) scale(1.05); }

#topBar { width:800px; display:flex; align-items:center; justify-content:space-between; padding:8px 16px; color:#fff; font-weight:900; font-size:18px; }
#topBar .coin { font-size:22px; }
#shopWrap { display:none; position:absolute; top:0; left:0; width:800px; height:600px; flex-direction:column; z-index:8; background:#0b2a4a; }
#shopHeader { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#0d3058; color:#fff; font-weight:900; font-size:20px; border-bottom:2px solid #1a4a7a; }
#shopGrid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 14px 40px; }
.shopCard { background:#11355e; border-radius:10px; padding:12px; color:#fff; border:2px solid #1a4a7a; display:flex; flex-direction:column; align-items:center; text-align:center; transition:border-color .2s, background .2s; }
.shopCard .name { font-weight:900; font-size:16px; margin-bottom:4px; }
.shopCard .desc { font-size:13px; color:#b3e5fc; margin-bottom:8px; min-height:32px; }
.shopCard .price { font-weight:900; font-size:18px; margin-bottom:8px; }
.shopCard.canBuy { border-color:#4dd0e1; }
.shopCard.cantBuy { border-color:#b71c1c; background:#1a0e0e; }
.shopCard.bought { border-color:#4caf50; background:#0e2a12; opacity:0.8; }
.shopCard .buyBtn { margin-top:auto; padding:6px 18px; font-size:14px; font-weight:900; border:none; border-radius:16px; cursor:pointer; }
.shopCard.canBuy .buyBtn { background:#4dd0e1; color:#003c4a; }
.shopCard.cantBuy .buyBtn { background:#616161; color:#ccc; cursor:not-allowed; }
.shopCard.bought .buyBtn { background:#388e3c; color:#fff; cursor:default; }
#backBtn { margin-left:14px; }
#warehouseWrap, #marketWrap { display:none; position:absolute; top:0; left:0; width:800px; height:600px; flex-direction:column; z-index:8; background:#0b2a4a; }
#warehouseHeader, #marketHeader { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#0d3058; color:#fff; font-weight:900; font-size:20px; border-bottom:2px solid #1a4a7a; }
.whCard { background:#1a2f4a; border:2px solid #1a4a7a; border-radius:10px; padding:10px; color:#fff; text-align:center; transition:border-color .2s, transform .2s; }
.whCard:hover { border-color:#4dd0e1; transform:translateY(-2px); }
.whCard .icon { font-size:28px; margin-bottom:4px; }
.whCard .name { font-weight:900; font-size:15px; }
.whCard .qty { font-size:13px; color:#b3e5fc; margin:4px 0; }
.whCard .qty span { color:#ffd54f; font-weight:900; }
.whCard .price { font-size:12px; color:#90a4ae; }
.whCard .total { font-size:13px; color:#81c784; font-weight:900; margin-top:2px; }
</style>

<body>
<div id="gameWrap">
  <div id="topBar"><span>🎣 めんたい工房 <small style="opacity:0.6;">v1.0.0</small></span><span class="coin" id="topCoin">💰 0MD</span></div>
  <div id="gameContainer">
    <canvas id="cv" width="800" height="600"></canvas>
    <div id="hud"><div id="scoreBox">Score: 0</div><div id="zoneBox" style="position:absolute;bottom:12px;left:14px;padding:4px 12px;background:rgba(0,0,0,0.45);border-radius:16px;color:#b3e5fc;font-weight:900;font-size:14px;">沿岸漁業</div><div id="timerBox">Time: 60</div><button id="returnBtn" onclick="returnToPort()" style="position:absolute;bottom:12px;right:14px;padding:6px 14px;background:linear-gradient(180deg,#ef5350,#c62828);color:#fff;border:none;border-radius:16px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(198,40,40,0.4);pointer-events:auto;">🏠 帰港</button></div>
    <div id="overlay"><div id="overlayContent"></div></div>
    <div id="shopWrap">
      <div id="shopHeader"><span>🛒 漁業ショップ</span><button class="btn btn-primary" id="backBtn" onclick="showTitle()">⬅ 戻る</button></div>
      <div id="shopGrid"></div>
    </div>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const overlay = document.getElementById('overlay');
const overlayContent = document.getElementById('overlayContent');
const shopWrap = document.getElementById('shopWrap');
const shopGrid = document.getElementById('shopGrid');
const topCoin = document.getElementById('topCoin');
const scoreBox = document.getElementById('scoreBox');
const timerBox = document.getElementById('timerBox');

const SAVE_KEY = 'fishing_save_v3';

// 魚スプライト
const fishSpriteImg = new Image();
fishSpriteImg.src = 'fish.png';
const SPRITE_COLS = 5;
const SPRITE_ROWS = 3;
const SPRITE_W = 1334 / 5;
const SPRITE_H = 800 / 3;
const SPRITE_MAP = {
  aji:    [0,0], iwashi: [1,0], ebi:   [2,0], kaki:  [3,0], hotate:  [4,0],
  saba:   [0,1], ika:    [1,1], sanma: [2,1], kani:  [3,1], sawara:  [4,1],
  maguro: [0,2], katsuo: [1,2], kinme: [2,2], sukedara:[3,2], kurage:  [4,2]
};

let totalPoints = 0;
let ownedItems = [];  // 旧互換用
let upgradeLevels = {}; // { ship_spd: 5, auto_man: 3, ... }
let fishStock = {};  // 各魚の種類ごとの在庫 { 'aji': 5, 'iwashi': 3, ... }
let screen = 'title';
let lastTime = 0;
let gameTime = 60;
let gameScore = 0;
let timer = 0;
let boatX = 400;
let targetBoatX = 400;
let hookState = 'idle'; // idle, drop, reel
let hookY = 70;
let hookMaxDepth = 500;
let hookOffX = 0; // triple rod offset
let autoBoats = []; // {x, targetX, hookState, hookY, caughtFish, timer}
let caughtFish = null;
let fishList = [];
let particles = [];
let bubbles = [];
let ripples = [];
let activeZone = 'coastal'; // 'coastal' | 'offshore' | 'pelagic'

const FISH_TYPES = {
  aji: { name:'アジ', pts:10, color:'#90caf9', r:10, speed:1.2, zone:'coastal' },
  iwashi: { name:'イワシ', pts:15, color:'#81d4fa', r:9, speed:1.5, zone:'coastal' },
  ebi: { name:'エビ', pts:30, color:'#ff7043', r:8, speed:1.0, zone:'coastal' },
  kaki: { name:'カキ', pts:15, color:'#b0bec5', r:10, speed:0.8, zone:'coastal' },
  hotate: { name:'ホタテ', pts:25, color:'#fff9c4', r:12, speed:0.5, zone:'coastal' },
  saba: { name:'サバ', pts:20, color:'#4fc3f7', r:13, speed:0.9, zone:'offshore' },
  ika: { name:'イカ', pts:35, color:'#ce93d8', r:14, speed:1.1, zone:'offshore' },
  sanma: { name:'サンマ', pts:30, color:'#b39ddb', r:12, speed:1.0, zone:'offshore' },
  kani: { name:'カニ', pts:25, color:'#ef5350', r:11, speed:0.7, zone:'offshore' },
  sawara: { name:'サワラ', pts:40, color:'#80cbc4', r:15, speed:0.8, zone:'offshore' },
  maguro: { name:'マグロ', pts:100, color:'#26a69a', r:22, speed:0.5, zone:'pelagic' },
  katsuo: { name:'カツオ', pts:70, color:'#4dd0e1', r:18, speed:0.6, zone:'pelagic' },
  kinme: { name:'キンメ', pts:80, color:'#ffca28', r:18, speed:0.6, zone:'pelagic' },
  sukedara: { name:'スケトウダラ', pts:120, color:'#cddc39', r:17, speed:0.8, zone:'pelagic' },
  kurage: { name:'クラゲ', pts:40, color:'#e1bee7', r:14, speed:0.4, zone:'pelagic' }
};

const UPGRADES = [
  { id:'boat_base', name:'ボート', desc:'沿岸漁業が可能！アジ、イワシ、エビなどが獲れる。', price:0, maxLv:1, req:[] },
  { id:'boat_mid', name:'中型船', desc:'沖合漁業が可能！サバ、イカ、サンマ、カニなどが獲れる。', price:300, maxLv:1, req:['boat_base'] },
  { id:'boat_large', name:'大型船', desc:'遠洋漁業が可能！マグロ、カツオ、スケトウダラなどが獲れる。', price:800, maxLv:1, req:['boat_mid'] },
  { id:'ship_spd', name:'船速UP', desc:'船の移動速度が上昇！レベルごとに+0.3倍', price:100, maxLv:99, req:[], priceScale:1.5 },
  { id:'ship_sonar', name:'魚群レーダー', desc:'同時出現数が増加！レベルごとに+1匹', price:200, maxLv:99, req:[], priceScale:1.5 },
  { id:'rod_fast', name:'高速釣り', desc:'釣り上げ速度が上昇！レベルごとに+0.5倍', price:150, maxLv:99, req:[], priceScale:1.5 },
  { id:'rod_long', name:'深海ロッド', desc:'最大水深が拡張！レベルごとに+50', price:200, maxLv:99, req:[], priceScale:1.5 },
  { id:'rod_gold', name:'ゴールド竿', desc:'スコアが1.5倍に！', price:300, maxLv:1, req:[] },
  { id:'rod_platinum', name:'プラチナ竿', desc:'スコアが2.0倍に！ゴールド竿の上位互換。', price:600, maxLv:1, req:['rod_gold'] },
  { id:'auto_man', name:'自動釣りマン', desc:'自動で釣ってくれる漁船！最大5隻まで', price:350, maxLv:5, req:[], priceScale:2.0 },
  { id:'triple_rod', name:'トリプル竿', desc:'釣り針が3本同時に！', price:450, maxLv:1, req:[] },
  { id:'big_hook', name:'でか釣り針', desc:'当たり判定2倍＆レア率UP', price:300, maxLv:1, req:[] }
];

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { 
      const d = JSON.parse(raw); 
      totalPoints = d.totalPoints||0; 
      upgradeLevels = d.upgradeLevels || {}; 
      fishStock = d.fishStock||{}; 
      ownedItems = d.items||[]; // 旧互換
      // v2→v3移行: 旧ownedItemsをupgradeLevelsにマイグレ
      if (d.items && !d.upgradeLevels) {
        const mg = {ship_spd:'ship_spd', ship_spd1:'ship_spd', ship_spd2:'ship_spd',
                    ship_sonar:'ship_sonar', ship_sonar1:'ship_sonar', ship_sonar2:'ship_sonar',
                    rod_fast:'rod_fast', rod_fast1:'rod_fast', rod_fast2:'rod_fast',
                    rod_long:'rod_long', rod_long1:'rod_long', rod_long2:'rod_long',
                    auto_man:'auto_man', auto_man1:'auto_man', auto_man2:'auto_man',
                    rod_gold:'rod_gold', rod_gold1:'rod_gold',
                    triple_rod:'triple_rod', big_hook:'big_hook',
                    boat_base:'boat_base', boat_mid:'boat_mid', boat_large:'boat_large'};
        d.items.forEach(id=>{ const k=mg[id]; if(k){ upgradeLevels[k]=(upgradeLevels[k]||0)+1; } });
        // maxLv制限
        ['boat_base','boat_mid','boat_large','rod_gold','triple_rod','big_hook'].forEach(k=>{
          if(upgradeLevels[k]>1) upgradeLevels[k]=1;
        });
        if(upgradeLevels.auto_man>5) upgradeLevels.auto_man=5;
        saveData();
      }
    }
  } catch(e){}
}
function saveData() {
  localStorage.setItem(SAVE_KEY, JSON.stringify({totalPoints, upgradeLevels, fishStock}));
}

function getStats() {
  let boatLevel = 1;
  if (upgradeLevels.boat_base) boatLevel = 1;
  if (upgradeLevels.boat_mid) boatLevel = 2;
  if (upgradeLevels.boat_large) boatLevel = 3;

  let spdLv = upgradeLevels.ship_spd || 0;
  let spdMult = 1.0 + spdLv * 0.3;

  let sonarLv = upgradeLevels.ship_sonar || 0;
  let maxFish = 12 + sonarLv;

  let fastLv = upgradeLevels.rod_fast || 0;
  let hookSpdMult = 1.0 + fastLv * 0.5;

  let longLv = upgradeLevels.rod_long || 0;
  let depth = 500 + longLv * 50;

  let scoreMult = 1.0;
  if (upgradeLevels.rod_platinum) scoreMult = 2.0;
  else if (upgradeLevels.rod_gold) scoreMult = 1.5;

  let autoMen = upgradeLevels.auto_man || 0;
  let tripleRod = !!upgradeLevels.triple_rod;
  let hookSize = upgradeLevels.big_hook ? 2.0 : 1.0;
  let rareBonus = upgradeLevels.big_hook ? 0.05 : 0;

  return { spdMult, maxFish, hookSpdMult, depth, scoreMult, autoMen, tripleRod, hookSize, rareBonus, boatLevel };
}

function updateCoin() { topCoin.textContent = '💰 ' + totalPoints + 'MD'; }

function showTitle() {
  screen = 'title'; overlay.style.display='flex'; shopWrap.style.display='none'; hud.style.display='none'; updateCoin();
  const st = getStats();
  let boatName = 'ボート';
  if (st.boatLevel===1) boatName = 'ボート（沿岸）';
  else if (st.boatLevel===2) boatName = '中型船（沖合）';
  else if (st.boatLevel===3) boatName = '大型船（遠洋）';
  overlayContent.innerHTML = `
    <h1>🎣 めんたい工房 <small style="font-size:0.4em;opacity:0.7;">v1.0.0</small></h1>
    <p>漁船を選んで、海へ出港しよう！</p>
    <div style="margin:14px 0; font-size:16px; color:#b3e5fc;">
      ← → キー / マウスで船を移動<br>クリック or スペースで釣り！
    </div>
    <div class="big">💰 ${totalPoints}MD</div>
    <div style="margin-top:10px;">
      <button class="btn btn-shop" onclick="showShop()">🛒 漁業ショップ</button>
      <button class="btn btn-storage" onclick="showWarehouse()">🏭 倉庫</button>
      <br>
      <button class="btn btn-primary" onclick="startGame('coastal')">🛶 沿岸漁業</button>
      <button class="btn btn-primary" onclick="startGame('offshore')" ${st.boatLevel<2?'disabled style=\'opacity:0.4;cursor:not-allowed;\'':''}>🚤 沖合漁業</button>
      <button class="btn btn-primary" onclick="startGame('pelagic')" ${st.boatLevel<3?'disabled style=\'opacity:0.4;cursor:not-allowed;\'':''}>🚢 遠洋漁業</button>
      <br>
      <button class="btn btn-primary" style="background:#ff8c00;" onclick="showAquaculture()">🦐 養殖場へ</button>
      <button class="btn btn-process" onclick="showFactory()">🔧 加工</button>
      <button class="btn btn-sell" onclick="showMarket()">🏪 販売</button>
      <br>
      <button class="btn btn-x" onclick="shareX()">𝕏 シェア</button>
    </div>`;
}

function showWarehouse() {
  screen = 'warehouse';
  overlay.style.display = 'flex';
  shopWrap.style.display = 'none';
  hud.style.display = 'none';
  updateCoin();
  buildWarehouse();
}

function buildWarehouse() {
  let entries = Object.entries(fishStock).filter(([k, v]) => v > 0);
  let totalValue = 0;
  let html = '';
  
  if (entries.length === 0) {
    html += `<p style="color:#9e9e9e;">📭 倉庫は空っぽです…</p>`;
  } else {
    html += `<div style="display:grid; grid-template-columns:repeat(5,1fr); gap:10px; max-height:380px; overflow-y:auto; padding:4px;">`;
    entries.sort((a, b) => b[1] - a[1]);
    entries.forEach(([type, qty]) => {
      const f = FISH_TYPES[type];
      if (!f) return;
      const sellPrice = Math.floor(f.pts * 0.8);
      const value = sellPrice * qty;
      totalValue += value;
      const sp = SPRITE_MAP[type];
      let icon = '🐟';
      if (type === 'ebi') icon = '🦐';
      else if (type === 'kani') icon = '🦀';
      else if (type === 'ika') icon = '🦑';
      else if (type === 'kurage') icon = '🪼';
      else if (type === 'maguro') icon = '🐋';
      else if (type === 'hotate') icon = '🐚';
      
      html += `
        <div style="background:#1a2f4a; border:2px solid #1a4a7a; border-radius:10px; padding:10px; text-align:center;">
          <div style="font-size:28px; margin-bottom:4px;">${icon}</div>
          <div style="font-weight:900; font-size:15px; color:#fff;">${f.name}</div>
          <div style="font-size:13px; color:#b3e5fc; margin:4px 0;">
            在庫: <span style="color:#ffd54f; font-weight:900;">${qty}</span>匹
          </div>
          <div style="font-size:12px; color:#90a4ae;">販売価: ${sellPrice}MD/匹</div>
          <div style="font-size:13px; color:#81c784; font-weight:900; margin-top:2px;">
            計: ${value}MD
          </div>
          <button class="btn" style="margin-top:6px; padding:6px 14px; font-size:13px; background:#66bb6a; color:#fff;"
            onclick="sellFish('${type}', 1)">売却</button>
          <button class="btn" style="margin-top:4px; padding:6px 10px; font-size:12px; background:#ef5350; color:#fff;"
            onclick="sellFish('${type}', ${qty})">全売却</button>
        </div>`;
    });
    html += `</div>`;
  }
  
  overlayContent.innerHTML = `
    <h1>🏭 倉庫</h1>
    <p>釣った魚はここにストックされているよ〜！販売してMDに換金しよう〜🦐</p>
    <div style="margin:10px 0; font-size:16px; color:#ffd54f; font-weight:900;">
      総在庫価値: ${totalValue}MD
    </div>
    ${html}
    <div style="margin-top:14px;">
      ${entries.length > 0 ? `<button class="btn btn-max" onclick="sellAllFish()">💰 全魚一括販売</button><br>` : ''}
      <button class="btn btn-primary" onclick="showTitle()">⬅ 戻る</button>
    </div>`;
}

function sellFish(type, qty) {
  const stock = fishStock[type] || 0;
  if (stock <= 0) return;
  qty = Math.min(qty, stock);
  const f = FISH_TYPES[type];
  if (!f) return;
  const pricePer = Math.floor(f.pts * 0.8);
  const earned = pricePer * qty;
  
  fishStock[type] = stock - qty;
  if (fishStock[type] <= 0) delete fishStock[type];
  totalPoints += earned;
  saveData();
  updateCoin();
  buildWarehouse();
}

function sellAllFish() {
  let entries = Object.entries(fishStock).filter(([k, v]) => v > 0);
  if (entries.length === 0) return;
  let totalEarned = 0;
  entries.forEach(([type, qty]) => {
    const f = FISH_TYPES[type];
    if (!f) return;
    totalEarned += Math.floor(f.pts * 0.8) * qty;
  });
  fishStock = {};
  totalPoints += totalEarned;
  saveData();
  updateCoin();
  buildWarehouse();
}

function showShop() {
  screen = 'shop'; overlay.style.display='none'; hud.style.display='none'; shopWrap.style.display='flex'; updateCoin();
  buildShop();
}
function buildShop() {
  shopGrid.innerHTML = '';
  UPGRADES.forEach(u => {
    const curLv = upgradeLevels[u.id] || 0;
    const isMax = curLv >= u.maxLv;
    const isOneOff = u.maxLv === 1;
    const owned = curLv > 0;
    
    // 必要アイテムチェック
    const reqsMet = u.req.every(r => (upgradeLevels[r] || 0) > 0);
    
    // 次回価格計算
    let nextPrice = 0;
    if (!isMax) {
      const scale = u.priceScale || 1.5;
      nextPrice = Math.floor(u.price * Math.pow(scale, curLv));
    }
    const canBuy = !isMax && totalPoints >= nextPrice && reqsMet;
    
    let cls = isMax ? 'bought' : (canBuy ? 'canBuy' : 'cantBuy');
    let btnTxt = isMax ? (isOneOff ? '✅ 購入済' : '🔒 MAX') : (!reqsMet ? '🔒 未解放' : (canBuy ? 'UPGRADE' : 'MD不足'));
    
    // レベル表示
    let lvTxt = isOneOff ? '' : `<div style="font-weight:900;font-size:14px;color:#ffd54f;margin-bottom:4px;">Lv.${curLv} / ${u.maxLv}</div>`;
    
    // 実際の効果計算
    let effectTxt = '';
    if (u.id === 'ship_spd') effectTxt = `速度 x${(1.0 + curLv * 0.3).toFixed(1)}`;
    else if (u.id === 'ship_sonar') effectTxt = `同時 ${12 + curLv}匹`;
    else if (u.id === 'rod_fast') effectTxt = `速さ x${(1.0 + curLv * 0.5).toFixed(1)}`;
    else if (u.id === 'rod_long') effectTxt = `水深 ${500 + curLv * 50}`;
    else if (u.id === 'rod_gold') effectTxt = `スコア x1.5`;
    else if (u.id === 'rod_platinum') effectTxt = `スコア x2.0`;
    else if (u.id === 'auto_man') effectTxt = `自動船 ${curLv}隻`;
    
    const maxBuyInfo = calcMaxBuy(u.id);
    const canMaxBuy = maxBuyInfo.count > 0 && reqsMet;
    
    const card = document.createElement('div');
    card.className = 'shopCard ' + cls;
    card.innerHTML = `
      ${lvTxt}
      <div class="name">${u.name}</div>
      <div class="desc">${u.desc}${effectTxt?'<br><small style="color:#ffd54f;">現在: '+effectTxt+'</small>':''}${u.req.length?'<br><small>必要: '+u.req.map(r=>UPGRADES.find(x=>x.id===r).name).join(', ')+'</small>':''}</div>
      <div class="price">
        ${isMax ? '---' : nextPrice + 'MD'}
        ${canMaxBuy ? '<br><small style="color:#b3e5fc;">MAX: ' + maxBuyInfo.totalPrice + 'MD→Lv.' + maxBuyInfo.finalLv + '</small>' : ''}
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; width:100%; margin-top:auto;">
        <button class="buyBtn">${btnTxt}</button>
        ${canMaxBuy ? '<button class="buyBtn" style="background:#ef5350; color:#fff;">MAX</button>' : ''}
      </div>`;
    const buttons = card.querySelectorAll('button');
    buttons[0].onclick = () => { if (!isMax && canBuy && reqsMet) { buyUpgrade(u.id); } };
    if (buttons[1]) {
      buttons[1].onclick = () => { buyUpgradeMax(u.id); };
    }
    shopGrid.appendChild(card);
  });
}
function calcMaxBuy(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u) return { count: 0, totalPrice: 0, finalLv: upgradeLevels[id] || 0 };
  let curLv = upgradeLevels[id] || 0;
  let totalPrice = 0;
  let count = 0;
  let spareMoney = totalPoints;
  while (curLv < u.maxLv) {
    const scale = u.priceScale || 1.5;
    const price = Math.floor(u.price * Math.pow(scale, curLv));
    if (spareMoney < price) break;
    spareMoney -= price;
    totalPrice += price;
    curLv += 1;
    count += 1;
  }
  return { count, totalPrice, finalLv: curLv };
}

function buyUpgradeMax(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u) return;
  if (u.req.some(r => (upgradeLevels[r] || 0) === 0)) return;
  let info = calcMaxBuy(id);
  if (info.count <= 0) return;
  totalPoints -= info.totalPrice;
  upgradeLevels[id] = info.finalLv;
  saveData(); updateCoin(); buildShop();
}
function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u) return;
  const curLv = upgradeLevels[id] || 0;
  if (curLv >= u.maxLv) return;
  const scale = u.priceScale || 1.5;
  const price = Math.floor(u.price * Math.pow(scale, curLv));
  if (totalPoints < price) return;
  if (u.req.some(r => (upgradeLevels[r] || 0) === 0)) return;
  
  totalPoints -= price;
  upgradeLevels[id] = curLv + 1;
  saveData(); updateCoin(); buildShop();
}

function startGame(zone='coastal') {
  screen = 'game'; overlay.style.display='none'; shopWrap.style.display='none'; hud.style.display='block';
  const st = getStats();
  activeZone = zone;
  gameTime = 60; gameScore = 0; timer = 0; boatX = 400; targetBoatX = 400;
  const zoneBox = document.getElementById('zoneBox');
  if (zoneBox) { zoneBox.textContent = zone==='coastal'?'沿岸漁業':zone==='offshore'?'沖合漁業':'遠洋漁業'; }
  hookState = 'idle'; hookY = 70; hookOffX = st.tripleRod ? 30 : 0;
  hookMaxDepth = st.depth; caughtFish = null;
  autoBoats = [];
  const sectionW = 800 / Math.max(st.autoMen, 1);
  for (let i=0; i<st.autoMen; i++) {
    let minX = i * sectionW;
    let maxX = (i+1) * sectionW;
    let bx = (minX + maxX) / 2;
    autoBoats.push({ 
      x:bx, targetX:bx, 
      minX: minX + 30, maxX: maxX - 30,
      hookState:'idle', hookY:70, 
      caughtFish:null, timer:0,
      maxDepth: st.depth
    });
  }
  fishList = []; particles = []; bubbles = []; ripples = [];
  for (let i=0;i<st.maxFish;i++) spawnFish();
  for (let i=0;i<20;i++) bubbles.push({x:Math.random()*800,y:Math.random()*500+120,r:Math.random()*3+1,spd:Math.random()*1+0.3});
}

function spawnFish() {
  const st = getStats();
  const zone = activeZone;
  // ゾーンごとの魚のリスト
  const pool = Object.entries(FISH_TYPES).filter(([k,v])=>v.zone===zone);
  if (pool.length===0) return;
  const [k, f] = pool[Math.floor(Math.random() * pool.length)];
  const y = Math.random()*(580-120)+120;
  fishList.push({
    type:k, ...f,
    x: Math.random()*800,
    y,
    vx: (Math.random()<0.5?1:-1) * (f.speed + (Math.random()*0.4-0.2)),
    angle:0,
    alive:true
  });
}

function getMouseX(e) {
  const rect = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  return (cx - rect.left) * (800 / rect.width);
}

function returnToPort() {
  if (screen !== 'game') return;
  
  // 釣っている途中で帰港しても魚は既に倉庫に入っている
  if (hookState === 'reel' && caughtFish) {
    const fish = FISH_TYPES[caughtFish.type];
    particles.push({x:boatX+caughtFish.xOff,y:50,vx:0,vy:-2,life:1,col:fish.color,type:'sparkle'});
    gameScore += fish.score;
  }
  
  showResult();
}

function onAction() { if (screen!=='game') return; const st=getStats();
  if (hookState==='idle') { hookState='drop'; caughtFish=null; }
  else if (hookState==='drop') { hookState='reel'; }
}

function addParticles(x,y,color,count=6) { for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:1,color}); }
function addRipple(x,y) { ripples.push({x,y,r:1,alpha:1}); }

function update(dt) {
  const st = getStats();
  if (screen==='game') {
    timer += dt;
    if (timer>=1) { timer-=1; gameTime--; timerBox.textContent='Time: '+gameTime; if(gameTime<=0){ showResult(); } }
    // player boat
    let spd = 0.08 * st.spdMult;
    if (keys['ArrowLeft']||keys['Left']) targetBoatX -= 6*st.spdMult;
    if (keys['ArrowRight']||keys['Right']) targetBoatX += 6*st.spdMult;
    targetBoatX = Math.max(40, Math.min(760, targetBoatX));
    boatX += (targetBoatX - boatX) * spd;
    // player hooks
    let dropSpd = 2.5 * st.hookSpdMult;
    let reelSpd = 3.0 * st.hookSpdMult;
    let hookXs = st.tripleRod ? [boatX-30, boatX, boatX+30] : [boatX];
    let pHook = {state:hookState, y:hookY, caughtFish:caughtFish};
    updateHook(pHook, hookXs, st, dropSpd, reelSpd);
    hookState = pHook.state; hookY = pHook.y; caughtFish = pHook.caughtFish;
    // auto boats
    autoBoats.forEach((ab, idx) => {
      ab.timer += dt;
      
      // 自分の担当エリア内の魚のみを候補に
      let candidates = [];
      fishList.forEach(f => {
        if (!f.alive || f.x < ab.minX || f.x > ab.maxX) return;
        let d = Math.hypot(f.x - ab.x, f.y - 150);
        candidates.push({f, d});
      });
      candidates.sort((a, b) => a.d - b.d);
      
      // 最近傍を追う（担当エリア内で）
      if (candidates.length > 0) {
        let nearest = candidates[0].f;
        // 35%で2番目を選んで分散
        if (candidates.length > 1 && Math.random() < 0.35 && candidates[1].d < candidates[0].d + 150) {
          nearest = candidates[1].f;
        }
        // 担当範囲内に収める
        ab.targetX = Math.max(ab.minX, Math.min(ab.maxX, nearest.x));
      } else {
        // 巡回モード: 担当エリアの中央付近を行き来
        let centerX = (ab.minX + ab.maxX) / 2;
        let rangeW = (ab.maxX - ab.minX) / 3;
        ab.targetX = Math.max(ab.minX + 10, Math.min(ab.maxX - 10, 
          centerX + Math.sin(Date.now() / 1500 + idx * 2.3) * rangeW));
      }
      
      ab.x += (ab.targetX - ab.x) * spd;
      
      // auto drop / reel
      let nearestDist = candidates.length > 0 ? candidates[0].d : 9999;
      if (ab.hookState === 'idle' && nearestDist < 350 && ab.timer > 1.0) { 
        ab.hookState = 'drop'; ab.timer = 0; 
      } else if (ab.hookState === 'drop' && (ab.hookY >= ab.maxDepth || ab.hookY >= hookMaxDepth || ab.timer > 3.5)) { 
        ab.hookState = 'reel'; 
      } else if (ab.hookState === 'reel' && ab.hookY <= 70) { 
        ab.hookState = 'idle'; ab.hookY = 70; 
        if (ab.caughtFish) { 
          gameScore += Math.floor(ab.caughtFish.pts * st.scoreMult); 
          scoreBox.textContent = 'Score: ' + gameScore; 
          ab.caughtFish = null; 
        } 
      }
      
      let autoHookXs = st.tripleRod ? [ab.x - hookOffX, ab.x, ab.x + hookOffX] : [ab.x];
      updateHook(
        {state: ab.hookState, y: ab.hookY, caughtFish: ab.caughtFish,
         setState: s => ab.hookState = s, 
         setY: y => ab.hookY = y,
         reset: () => { ab.hookState = 'idle'; ab.hookY = 70; }
        }, 
        autoHookXs, st, dropSpd, reelSpd, ab
      );
    });
    // fish
    while(fishList.length<st.maxFish) spawnFish();
    fishList.forEach(f=>{
      f.x += f.vx; f.angle += 0.05;
      if (f.x<-30) f.x=830; if (f.x>830) f.x=-30;
      f.y += Math.sin(f.angle)*0.4;
    });
    fishList = fishList.filter(f=>f.alive);
    // bubbles
    bubbles.forEach(b=>{ b.y -= b.spd; if (b.y<120){ b.y=580; b.x=Math.random()*800; } });
    // particles
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life-=0.03; });
    particles = particles.filter(p=>p.life>0);
    // ripples
    ripples.forEach(r=>{ r.r+=1.5; r.alpha-=0.025; });
    ripples = ripples.filter(r=>r.alpha>0);
  }
}

function updateHook(hookObj, hookXs, st, dropSpd, reelSpd, abObj) {
  let useDirect = !hookObj.setState;
  let setState = useDirect ? (s=> hookObj.state=s) : (s=> hookObj.setState(s));
  let setY = useDirect ? (y=> hookObj.y=y) : (y=> hookObj.setY(y));
  let caughtList = abObj ? abObj.caughtFishList : hookObj.caughtFishList;
  if (!caughtList) {
    caughtList = [];
    if (abObj) abObj.caughtFishList = caughtList;
    else hookObj.caughtFishList = caughtList;
  }
  const multiHook = hookXs.length > 1;
  for (let hi = 0; hi < hookXs.length; hi++) {
    let hx = hookXs[hi];
    let hy = hookObj.y;
    let caught = caughtList[hi];
    if (hookObj.state==='drop') {
      // 多本針の場合、底で待機して魚がかかるまで降ろし続ける
      const atBottom = hy >= hookMaxDepth;
      const allCaught = caughtList.length === hookXs.length && caughtList.every(c => !!c);
      if (!multiHook || !atBottom || !allCaught) {
        if (!atBottom) hy += dropSpd;
      }
      if (!multiHook && atBottom) setState('reel');
      if (multiHook && allCaught) setState('reel');
    }
    else if (hookObj.state==='reel') {
      hy -= reelSpd;
      if (hy<=70) {
        hy=70; setState('idle');
        // 着水時にすべての caughtFish を倉庫に入れる
        for (let cf of caughtList) {
          if (!cf) continue;
          const fType = cf.type || cf.name;
          fishStock[fType] = (fishStock[fType]||0) + 1;
          gameScore += Math.floor(cf.pts * st.scoreMult);
        }
        if (caughtList.length > 0) {
          scoreBox.textContent = 'Score: ' + gameScore;
          saveData();
        }
        caughtList.length = 0;
        if (abObj) abObj.caughtFish = null;
        else hookObj.caughtFish = null;
      }
    }
    setY(hy);
    if (caught) continue; // この針は既に魚を持ってる
    for (let f of fishList) {
      if (!f.alive) continue;
      let dx = hx - f.x; let dy = (hy+35) - f.y;
      if (Math.hypot(dx,dy) < (f.r+10)*st.hookSize) {
        let cf = {name:f.name, pts:f.pts, type:f.type || f.name}; f.alive=false;
        addParticles(f.x,f.y,f.color,10); addRipple(f.x,f.y);
        caughtList[hi] = cf;
        // 後方互換: 代表で1匹も保持
        if (abObj) abObj.caughtFish = cf;
        else hookObj.caughtFish = cf;
        // 一本釣りは即座にリール、多本針は全てかかるまで待機
        if (!multiHook) setState('reel');
        break;
      }
    }
  }
}

function drawBoat(bx, hy, cf, isPlayer, st) {
  const boatLevel = st.boatLevel || 1;
  const bL = boatLevel;
  let boatColor = isPlayer ? '#5d4037' : '#4a148c';
  let bodyColor = isPlayer ? '#8d6e63' : '#6a1b9a';
  let hullColor = isPlayer ? '#3e2723' : '#311b92';

  if (bL === 3) { // 大型船
    let w=48, h=16;
    ctx.fillStyle=hullColor; ctx.fillRect(bx-w,65,w*2,h);
    ctx.fillStyle=bodyColor; ctx.fillRect(bx-w+4,62,w*2-8,6);
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(bx-w+10,58,14,8);
    // 多数のマスト
    ctx.strokeStyle='#5d4037'; ctx.lineWidth=3; 
    ctx.beginPath(); ctx.moveTo(bx-28,65); ctx.lineTo(bx-28,30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+28,65); ctx.lineTo(bx+28,30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,65); ctx.lineTo(bx,20); ctx.stroke();
    ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.moveTo(bx-36,76); ctx.lineTo(bx+36,76); ctx.lineTo(bx+26,88); ctx.lineTo(bx-26,88); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f0f0f0'; ctx.beginPath(); ctx.arc(bx+10,55,4,0,Math.PI*2); ctx.fill();
    ctx.font='bold 10px sans-serif'; ctx.fillStyle='#ffd54f'; ctx.fillText('🚢', bx-6, 86);
  } else if (bL === 2) { // 中型船
    let w=32, h=14;
    ctx.fillStyle=hullColor; ctx.fillRect(bx-w-4,65,w*2+8,h);
    ctx.fillStyle=bodyColor; ctx.fillRect(bx-w,62,w*2,6);
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(bx-8,59,16,6);
    ctx.strokeStyle='#5d4037'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(bx,55); ctx.lineTo(bx+2,25); ctx.stroke();
    ctx.fillStyle=hullColor; ctx.beginPath(); ctx.moveTo(bx-32,76); ctx.lineTo(bx+32,76); ctx.lineTo(bx+22,86); ctx.lineTo(bx-22,86); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f0f0f0'; ctx.beginPath(); ctx.arc(bx,52,3,0,Math.PI*2); ctx.fill();
    ctx.font='bold 10px sans-serif'; ctx.fillStyle='#ffd54f'; ctx.fillText('🚤', bx-6, 84);
  } else { // 沿岸ボート
    ctx.fillStyle=hullColor; ctx.fillRect(bx-20,62,40,10);
    ctx.fillStyle=bodyColor; ctx.beginPath(); ctx.ellipse(bx,62,20,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=boatColor; ctx.beginPath(); ctx.ellipse(bx,68,14,3,0,0,Math.PI*2); ctx.fill();
    // パドル
    ctx.strokeStyle='#5d4037'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(bx-4,55); ctx.lineTo(bx+4,45); ctx.stroke();
    ctx.fillStyle=hullColor; ctx.beginPath(); ctx.moveTo(bx-24,70); ctx.lineTo(bx+24,70); ctx.lineTo(bx+16,78); ctx.lineTo(bx-16,78); ctx.closePath(); ctx.fill();
    ctx.font='bold 10px sans-serif'; ctx.fillStyle='#ffd54f'; ctx.fillText('🛶', bx-6, 82);
  }

  let hookXs = st.tripleRod ? [bx-30, bx, bx+30] : [bx];
  hookXs.forEach(hx=>{
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(hx,70); ctx.lineTo(hx,hy+25); ctx.stroke();
    let hr = 5 * st.hookSize;
    ctx.strokeStyle='#b0bec5'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,hy+20,hr,0,Math.PI,false); ctx.stroke();
  });
  if (cf) { ctx.font='bold 14px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(cf.name, bx-20, hy+50); }
  if (!isPlayer) { ctx.font='bold 12px sans-serif'; ctx.fillStyle='#ffd54f'; ctx.fillText('🤖', bx-6, 50); }
}

function draw() {
  let pal;
  switch(activeZone) {
    case 'offshore':  pal = {bg:'#0c3540', sky:'#1565c0', surface:'#0288d1', water:'#013a4a'}; break;
    case 'pelagic':   pal = {bg:'#1a0826', sky:'#311b92', surface:'#6a1b9a', water:'#240024'}; break;
    case 'coastal':
    default:          pal = {bg:'#0b2a4a', sky:'#1565c0', surface:'#0277bd', water:'#01579b'}; break;
  }
  ctx.fillStyle=pal.bg; ctx.fillRect(0,0,800,600);
  ctx.fillStyle=pal.sky; ctx.fillRect(0,0,800,100);
  ctx.fillStyle=pal.surface; ctx.fillRect(0,95,800,10);
  ctx.fillStyle=pal.water; ctx.fillRect(0,105,800,495);
  // bubbles
  bubbles.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fill(); });
  // ripples
  ripples.forEach(r=>{ ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.strokeStyle=`rgba(255,255,255,${r.alpha*0.5})`; ctx.lineWidth=2; ctx.stroke(); });
  const stDraw = getStats();
  drawBoat(boatX, hookY, caughtFish, true, stDraw);
  autoBoats.forEach(ab=>{ drawBoat(ab.x, ab.hookY, ab.caughtFish, false, stDraw); });
  // fish
  fishList.forEach(f=>{
    const sp = SPRITE_MAP[f.type];
    if(!sp || !fishSpriteImg.complete) {
      ctx.save(); ctx.translate(f.x,f.y); if(f.vx<0) ctx.scale(-1,1);
      ctx.fillStyle=f.color; ctx.beginPath(); ctx.ellipse(0,0,f.r*1.4,f.r,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-f.r*1.1,0); ctx.lineTo(-f.r*1.8,-f.r*0.6); ctx.lineTo(-f.r*1.8,f.r*0.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(f.r*0.6,-f.r*0.2,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(f.r*0.7,-f.r*0.2,1.5,0,Math.PI*2); ctx.fill();
      ctx.restore(); return;
    }
    ctx.save(); ctx.translate(f.x,f.y); if(f.vx>0) ctx.scale(-1,1);
    const sx=sp[0]*SPRITE_W, sy=sp[1]*SPRITE_H;
    const s=(f.r*2.6)/Math.min(SPRITE_W,SPRITE_H);
    const dw=SPRITE_W*s, dh=SPRITE_H*s;
    ctx.drawImage(fishSpriteImg, sx, sy, SPRITE_W, SPRITE_H, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  });
  // particles
  particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
  // title ambient
  if (screen==='title') { ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.beginPath(); ctx.arc(400,200,180,0,Math.PI*2); ctx.fill(); }
}

function tick(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(tick);
}

loadSave(); updateCoin(); showTitle(); requestAnimationFrame(tick);
</script>
</body>
